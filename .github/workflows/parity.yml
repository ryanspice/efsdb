name: PHP and Rust parity

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  TMPDIR: ${{ github.workspace }}/.ai/evidence/ci/tmp
  TEMP: ${{ github.workspace }}/.ai/evidence/ci/tmp
  TMP: ${{ github.workspace }}/.ai/evidence/ci/tmp
  EFSDB_PHP_ERROR_LOG: ${{ github.workspace }}/.ai/evidence/ci/php-error.log
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ai/evidence/ci/cargo-target

jobs:
  parity:
    name: PHP ${{ matrix.php }} core and Rust parity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare project-local evidence
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - uses: shivammathur/setup-php@v2
        env:
          update: 'true'
          fail-fast: 'true'
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, openssl, sodium, phar, zip, zlib, iconv
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Enforce PHP security floor
        run: bun run check:runtime
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf build-essential pkg-config
      - name: Build BLAKE3 for the selected PHP ABI
        run: bash scripts/ci-build-blake3.sh 2>&1 | tee .ai/evidence/ci/native-build.log
      - name: Verify portable PHP startup and worker configuration
        run: bun test tests/php-launcher.test.ts 2>&1 | tee .ai/evidence/ci/php-launcher.log
      - name: Run API, auth and conformance checks
        run: bun run check 2>&1 | tee .ai/evidence/ci/core.log
      - name: Run PHP characterizations and envelope security regressions
        run: |
          for test in spec/characterization/php/*Characterization.php; do
            name="$(basename "$test" .php)"
            bun run ./scripts/php-core.ts -- -d "efsdb.process_id=ci-$name" "$test" 2>&1 | tee ".ai/evidence/ci/$name.log"
          done
          bun run ./scripts/php-core.ts -- -d efsdb.process_id=ci-envelope-bounds tests/fixtures/php_envelope_bounds.php 2>&1 | tee .ai/evidence/ci/envelope-bounds.log
      - name: Run parity preflight and PHP fixtures
        run: |
          bun run check:php-ini 2>&1 | tee .ai/evidence/ci/php-ini.log
          bun run ./scripts/php-core.ts -- -d efsdb.process_id=parity-preflight tests/fixtures/php_parity_preflight.php 2>&1 | tee .ai/evidence/ci/preflight.log
          bun run ./scripts/php-core.ts -- -d efsdb.process_id=parity-baseline tests/fixtures/run_php_parity_baseline.php 2>&1 | tee .ai/evidence/ci/php-parity.log
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path efsdb-core/Cargo.toml 2>&1 | tee .ai/evidence/ci/cargo.log
      - name: Enforce parity counts and zero skipped tests
        run: node scripts/ci-check-parity.mjs
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-php-${{ matrix.php }}
          path: |
            .ai/evidence/ci/*.log
            .ai/evidence/ci/parity-result.json
            .ai/evidence/ci/blake3-build.txt
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
