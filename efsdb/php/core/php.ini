[PHP]
extension_dir = "${EFSDB_PHP_EXTENSION_DIR}"
extension = "${EFSDB_PHP_BLAKE3_EXTENSION}"
; The canonical launcher supplies only non-built-in required modules through PHP_INI_SCAN_DIR.
error_reporting=E_ALL
display_errors=On
log_errors=On
error_log="${EFSDB_PHP_ERROR_LOG}"
date.timezone="America/Toronto"
